<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>seedless — og card</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px; height: 630px; background: #000;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #fff; overflow: hidden;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .frame {
    width: 1200px; height: 630px; padding: 64px 72px;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative; overflow: hidden;
  }
  .glow {
    position: absolute; top: -220px; left: 50%; transform: translateX(-50%);
    width: 1000px; height: 620px;
    background: radial-gradient(ellipse, rgba(0,174,255,0.20), rgba(0,174,255,0) 68%);
  }

  .top { position: relative; }
  .badge {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 9px 16px; border: 1px solid rgba(255,255,255,0.10);
    border-radius: 999px; background: rgba(0,174,255,0.05);
    font-size: 15px; font-weight: 700; color: #a8b3c7; letter-spacing: 0.01em;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #00aeff; box-shadow: 0 0 14px #00aeff; }

  .mid { position: relative; }
  h1 {
    font-size: 88px; font-weight: 900; line-height: 0.98;
    letter-spacing: -0.038em;
  }
  h1 .accent { color: #00aeff; }
  .sub {
    margin-top: 26px; font-size: 26px; font-weight: 500;
    color: #a8b3c7; letter-spacing: -0.012em;
  }

  .bottom {
    position: relative; display: flex; align-items: center; justify-content: space-between;
    padding-top: 30px; border-top: 1px solid rgba(255,255,255,0.08);
  }
  .lockup { display: flex; align-items: center; gap: 14px; }
  .lockup img { width: 52px; height: 52px; border-radius: 14px; display: block; }
  .lockup span { font-size: 32px; font-weight: 800; letter-spacing: -0.025em; }
  .url { font-size: 21px; font-weight: 600; color: #5b6478; letter-spacing: -0.01em; }
</style>
</head>
<body>
  <div class="frame">
    <div class="glow"></div>

    <div class="top">
      <div class="badge"><span class="dot"></span>Launching September 24</div>
    </div>

    <div class="mid">
      <h1>Get Paid in Dollars<br/><span class="accent">Spend in Naira</span></h1>
      <p class="sub">The money app for people who get paid in dollars.</p>
    </div>

    <div class="bottom">
      <div class="lockup">
        <img src="public/assets/logo.png" alt="" />
        <span>Seedless</span>
      </div>
      <div class="url">seedlesslabs.xyz</div>
    </div>
  </div>
</body>
</html>
